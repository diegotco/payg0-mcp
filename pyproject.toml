[project]
name = "payg0-mcp"
version = "0.1.0"
description = "Servidor MCP de Payg0: conecta tu billetera de Payg0 a agentes de IA."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
payg0-mcp = "payg0_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
